version: "3.3"

services:
  frontend:
    image: node:24-alpine
    container_name: iistw-frontend
    working_dir: /app
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 6002
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    network_mode: "host"
    command: sh -c "npm ci --include=dev && npm run build && npm prune --omit=dev && npm start"
    restart: unless-stopped

volumes:
  frontend_node_modules:
  frontend_next:
